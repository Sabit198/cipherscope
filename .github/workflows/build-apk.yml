name: Build CipherScope APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Fix for phone developers: Generates gradlew automatically if missing
      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper missing or incomplete. Generating in cloud..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq gradle
            gradle wrapper --gradle-version 8.6
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CipherScope-v1.0-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
